[package]
name = "amadeus"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amadeus_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
core-foundation = "0.10.1"
foreign-types = "0.5.0"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSWorkspace", "NSRunningApplication", "libc", "NSWindow", "NSColor", "NSResponder", "NSView", "NSScreen", "NSAnimationContext", "NSAnimation", "NSApplication", "NSEvent", "NSGraphicsContext"] }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSThread", "NSNotification", "NSOperation", "block2"] }
block2 = "0.6"
ureq = { version = "2", default-features = false, features = ["json"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNObservation", "VNRequestHandler", "VNRequest", "objc2-core-image", "objc2-image-io"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
